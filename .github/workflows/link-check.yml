name: Link check

on:
  pull_request:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    # Branch pushes only: path filters are ignored for tag pushes, which
    # would otherwise re-run the whole check on every release.
    branches: ["main"]
    paths:
      - "scripts/check_links.py"
      - ".github/workflows/link-check.yml"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Job-level so steps can test them: the secrets context is not
      # available inside a step-level `if:`.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check links
        id: check
        continue-on-error: true
        run: python3 scripts/check_links.py --markdown-out link-report.md

      - name: Publish report to the job summary
        if: always()
        run: cat link-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Telegram notification
        if: always() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          python3 - <<'PY' > message.txt
          text = open("link-report.md", encoding="utf-8").read()
          print(text[:3900] + ("\n..." if len(text) > 3900 else ""))
          PY
          # Record the API answer: a bare "curl: 22" hides whether the chat
          # id is wrong or the token is rejected.
          code=$(curl -sS -o telegram-response.json -w '%{http_code}' -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text@message.txt")
          echo "telegram http $code"
          jq -r 'if .ok then "delivered: message_id \(.result.message_id)" else "rejected: \(.error_code) \(.description)" end' telegram-response.json
          [ "$code" = "200" ]

      # Issues are optional: this repository may run with them disabled.
      - name: Open or update a tracking issue
        if: steps.check.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create link-rot --color BFD4F2 --description "Automated link rot report" 2>/dev/null || true
          existing=$(gh issue list --label link-rot --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file link-report.md
          else
            gh issue create --title "Dead links detected" --label link-rot --body-file link-report.md
          fi

      - name: Fail the run when links are dead
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::Dead links found; see the job summary."
          exit 1
