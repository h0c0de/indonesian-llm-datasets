name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GIT_CLIFF_VERSION: "2.14.2"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-cliff needs the full history and the tags

      - name: Install git-cliff
        run: |
          file="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-musl"
          url="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}"
          tmp="$(mktemp -d)"
          curl -sSL -o "$tmp/$file.tar.gz" "$url/$file.tar.gz"
          curl -sSL -o "$tmp/$file.tar.gz.sha512" "$url/$file.tar.gz.sha512"
          (cd "$tmp" && sha512sum -c "$file.tar.gz.sha512")
          tar -xzf "$tmp/$file.tar.gz" -C "$tmp"
          install -m755 "$tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
          git-cliff --version

      - name: Render release notes
        run: |
          git-cliff --current --strip header > RELEASE_NOTES.md
          sed -i '1{/^$/d}' RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Refuse to publish empty notes
        run: |
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::git-cliff produced no notes for $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
